name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # REQ-2.4.1: schedules must be byte-identical across supported versions.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes
      - name: Lint
        run: python -m pyflakes classism experiments
      # REQ-61.4: the hardware-free integration suite runs here and must pass
      # before any hardware session. The synthetic source runs in real time.
      # Under Xvfb the keyboard-hook tests drive the real pynput hook with
      # xdotool key events.
      - name: Tests
        run: xvfb-run -a python -m pytest experiments/recording/tests -q -rs
      - name: Dry run of the reference configuration
        run: |
          python -m experiments.recording --config configs/S01.yaml --dry-run
          test ! -e data
